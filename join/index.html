<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家計簿への招待 | The Simple 家計簿</title>
<meta name="description" content="The Simple 家計簿で、一緒に家計簿をつけましょう。">
<meta name="robots" content="noindex">
<meta property="og:title" content="家計簿への招待が届いています">
<meta property="og:description" content="リンクを開くと「The Simple:家計簿」で一緒に使えます。">
<style>
:root { --bg:#fff; --surface:#f5f5f7; --text:#1d1d1f; --sub:#6e6e73; --accent:#1d7f4f; --green:#30a46c;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#000; --surface:#1c1c1e; --text:#f5f5f7; --sub:#a1a1a6; --green:#34c77b; color-scheme:dark } }
:root[data-theme="dark"] { --bg:#000; --surface:#1c1c1e; --text:#f5f5f7; --sub:#a1a1a6; --green:#34c77b; color-scheme:dark }
* { box-sizing:border-box }
body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:var(--font); line-height:1.7;
  display:flex; align-items:center; justify-content:center; padding:24px 16px; }
main { width:100%; max-width:420px; text-align:center }
.logo { font-weight:700; font-size:17px; margin:0 0 28px } .logo span { color:var(--green) }
.icon { width:88px; height:88px; border-radius:22px; margin:0 auto 18px; background:var(--accent); display:flex; align-items:center; justify-content:center; color:#fff; font-size:40px; font-weight:700 }
h1 { font-size:24px; margin:0 0 8px; line-height:1.4 }
p { color:var(--sub); margin:0 0 22px; font-size:15px }
.btn { display:block; width:100%; padding:15px; border-radius:14px; background:var(--accent); color:#fff; font-weight:700; font-size:17px; text-decoration:none }
.box { background:var(--surface); border-radius:16px; padding:16px 18px; margin-top:22px; text-align:left; font-size:14px; color:var(--sub) }
.box b { color:var(--text) }
.err { display:none }
</style>
</head>
<body>
<main>
  <p class="logo">The Simple<span>:</span> 家計簿</p>
  <div class="icon" aria-hidden="true">¥</div>
  <div id="ok">
    <h1>家計簿への招待が届いています</h1>
    <p>アプリで開くと、この家計簿に参加して一緒に記録できます。</p>
    <a class="btn" id="open" href="kakeibo://join">アプリで開く</a>
    <div class="box">
      <b>アプリがまだ入っていない場合</b><br>
      <a href="https://apps.apple.com/jp/app/id6834584166" style="color:var(--accent);font-weight:700">App Store で「The Simple:家計簿」を入れて</a>から、もう一度この招待のリンクを開いてください。<br><br>
      <b>LINE などで開いた場合</b><br>
      うまく開かないときは、右下のメニューから「ブラウザで開く」を選んでください。
    </div>
  </div>
  <div id="bad" class="err">
    <h1>招待のリンクが正しくありません</h1>
    <p>リンクが途中で切れているかもしれません。招待した人に、もう一度リンクを送ってもらってください。</p>
  </div>
</main>
<script>
(function () {
  var h = location.hash.slice(1);
  if (!h) { document.getElementById('ok').style.display = 'none'; document.getElementById('bad').style.display = 'block'; return; }
  document.getElementById('open').href = 'kakeibo://join#' + h;
})();
</script>
</body>
</html>
